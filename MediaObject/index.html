<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Object Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Media Object Layout</h1>

    <div class="media">

        <img src="images/html.png" alt="HTML Logo">

        <div class="content">

            <h2>HTML5</h2>

            <p>
                HTML5 is the latest version of HTML used to create
                the structure of web pages. It provides semantic tags,
                multimedia support, and many modern web features.
            </p>

            <button>Learn More</button>

        </div>

    </div>

</body>
</html>
